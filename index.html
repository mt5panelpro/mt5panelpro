
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Gold Trading UI</title>
<style>
:root{
  --line:#1d1d1d;--muted:#929292;--blue:#2798ff;--red:#ff515b;--green:#29c66f;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{overflow-x:hidden}
.app{width:100%;min-height:100dvh;background:#000;padding-top:env(safe-area-inset-top);padding-bottom:calc(76px + env(safe-area-inset-bottom))}
.notice{padding:6px 12px;text-align:center;background:#201900;color:#e9c655;font-size:10px;border-bottom:1px solid #4d3d00}
.topbar{height:57px;display:grid;grid-template-columns:50px 1fr 50px;align-items:center;border-bottom:1px solid var(--line);padding:0 7px}
.topbar button{border:0;background:transparent;color:#aaa;font-size:25px;height:48px}
.title{text-align:center;font-size:20px;font-weight:750}
.live{display:flex;justify-content:center;align-items:center;gap:7px;padding:9px 12px 0;color:#8f8f8f;font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:#d4a600}.dot.ok{background:var(--green)}.dot.err{background:var(--red)}
.goal{text-align:center;color:#a5a5a5;font-size:13px;padding:10px 14px 0}
.floating{text-align:center;padding:10px 14px 13px;font-size:36px;font-weight:760;font-variant-numeric:tabular-nums}
.blue{color:var(--blue)}.red{color:var(--red)}
.progress-wrap{padding:0 14px 14px;border-bottom:1px solid var(--line)}
.progress-head{display:flex;justify-content:space-between;font-size:13px;color:#aaa;margin-bottom:7px}
.progress-track{height:8px;background:#181818;border-radius:999px;overflow:hidden}
.progress-bar{height:100%;width:0;background:#fff;border-radius:999px;transition:width .35s}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px 25px;padding:14px;border-bottom:1px solid var(--line)}
.stat{display:flex;justify-content:space-between;gap:8px;font-size:15px}.stat span:first-child{color:var(--muted)}.stat strong{font-variant-numeric:tabular-nums}
.tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}
.tab{padding:14px 8px;border:0;border-bottom:2px solid transparent;background:transparent;color:#777;font-size:17px}
.tab.active{color:#fff;border-bottom-color:#fff}
.view{display:none}.view.active{display:block}
.section{padding:11px 14px;color:#858585;font-size:12px;letter-spacing:.5px;border-bottom:1px solid var(--line)}
.order,.history-order{padding:12px 14px;border-bottom:1px solid #171717}
.order-top{display:flex;justify-content:space-between;gap:12px}.symbol{font-size:18px;font-weight:750}.side{margin-left:7px;font-size:14px;font-weight:700}
.profit{font-size:21px;font-weight:750;font-variant-numeric:tabular-nums}
.meta{margin-top:5px;display:flex;justify-content:space-between;gap:10px;color:#8e8e8e;font-size:12px;font-variant-numeric:tabular-nums}
.history-summary{padding:11px 14px;border-bottom:1px solid var(--line)}
.summary-row{display:flex;justify-content:space-between;padding:6px 0;font-size:17px}.summary-row span:first-child{color:#a0a0a0}
.bottom{position:fixed;left:0;right:0;bottom:0;height:calc(70px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(4,1fr);background:#090909;border-top:1px solid #262626}
.nav{border:0;background:transparent;color:#777;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px}.nav b{font-size:21px}.nav.active{color:#fff}
.modal{position:fixed;inset:0;display:none;align-items:flex-end;background:rgba(0,0,0,.76);z-index:30}.modal.open{display:flex}
.sheet{width:100%;background:#111;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 10px}.sheet p{color:#aaa;font-size:14px}.sheet label{display:block;color:#bbb;font-size:13px;margin:12px 0 6px}
.sheet input{width:100%;background:#050505;color:#fff;border:1px solid #383838;border-radius:10px;padding:12px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.actions button{border:0;border-radius:10px;padding:12px;background:#2b2b2b;color:#fff}.actions .primary{background:#1976d2}
@media(min-width:700px){.app{max-width:520px;margin:0 auto;border-left:1px solid #151515;border-right:1px solid #151515}.bottom{left:50%;right:auto;transform:translateX(-50%);width:520px}.modal{align-items:center;justify-content:center}.sheet{max-width:440px;border-radius:18px;padding:20px}}
</style>
</head>
<body>
<div class="app">
  
  <header class="topbar">
    <button aria-label="เมนู">☰</button>
    <div id="pageTitle" class="title">Trade</div>
    <div></div>
  </header>

  <section id="tradeHeader">
    <div id="floatingProfit" class="floating blue">+0.00 USD</div>

    <div class="progress-wrap">
      <div class="progress-head"><span>Progress</span><strong id="progressText">0%</strong></div>
      <div class="progress-track"><div id="progressBar" class="progress-bar"></div></div>
    </div>

    <div class="stats">
      <div class="stat"><span>Balance</span><strong id="balance">2,184.52</strong></div>
      <div class="stat"><span>Equity</span><strong id="equity">2,184.52</strong></div>
      <div class="stat"><span>Margin</span><strong id="margin">3.27</strong></div>
      <div class="stat"><span>Free Margin</span><strong id="freeMargin">2,181.25</strong></div>
      <div class="stat"><span>Margin Level</span><strong id="marginLevel">66,804.89%</strong></div>
      <div class="stat"><span>Gold</span><strong id="goldPrice">4,100.000</strong></div>
    </div>
  </section>

  <div class="tabs">
    <button class="tab active" data-view="tradeView">Trade</button>
    <button class="tab" data-view="historyView">History</button>
  </div>

  <section id="tradeView" class="view active">
    <div class="section">POSITIONS</div>
    <div id="orders"></div>
  </section>

  <section id="historyView" class="view">
    <div class="history-summary">
      <div class="summary-row"><span>Deposit</span><strong>100.00</strong></div>
      <div class="summary-row"><span>Withdrawal</span><strong>0.00</strong></div>
      <div class="summary-row"><span>Profit</span><strong id="closedProfit">2,084.52</strong></div>
      <div class="summary-row"><span>Swap</span><strong id="totalSwap">0.00</strong></div>
      <div class="summary-row"><span>Commission</span><strong>0.00</strong></div>
      <div class="summary-row"><span>Balance</span><strong id="historyBalance">2,184.52</strong></div>
    </div>
    <div class="section">CLOSED ORDERS</div>
    <div id="historyOrders"></div>
  </section>
</div>

<nav class="bottom">
  <button class="nav"><b>↕</b><span>Quotes</span></button>
  <button class="nav"><b>⌗</b><span>Chart</span></button>
  <button id="tradeNav" class="nav active"><b>⇄</b><span>Trade</span></button>
  <button id="historyNav" class="nav"><b>◷</b><span>History</span></button>
</nav>


<script>
(() => {
  const fmt = new Intl.NumberFormat('en-US',{
    minimumFractionDigits:2,
    maximumFractionDigits:2
  });

  const deposit = 100;
  const dailyTarget = 90;
  const todayStartProfit = 2084.52;

  /*
    อัตรา Swap โดยประมาณสำหรับ XAUUSDm lot 0.01 ต่อคืน
    ปรับตัวเลข 2 บรรทัดนี้ได้ตามโบรกเกอร์/ประเภทบัญชี
  */
  const SWAP_BUY_PER_NIGHT = -0.18;
  const SWAP_SELL_PER_NIGHT = -0.08;
  const TRIPLE_SWAP_DAY = 3; // 0=อาทิตย์, 1=จันทร์, 2=อังคาร, 3=พุธ

  let closedProfit = todayStartProfit;
  let marketPrice = 4100.000;
  let ticket = 61023001;
  const marginPerOrder = 1.09;

  const closedOrders = [
    closed('buy', 4090.310, 4093.820, 35.10, -0.18),
    closed('sell', 4102.440, 4098.960, 34.80, -0.08),
    closed('buy', 4080.250, 4086.770, 65.20, -0.54)
  ];

  const savedOpenSwaps = JSON.parse(
    localStorage.getItem('gold_ui_open_swaps') || '[0,0,0]'
  );

  const orders = [
    order('buy', marketPrice - 0.30, savedOpenSwaps[0] || 0),
    order('sell', marketPrice + 0.55, savedOpenSwaps[1] || 0),
    order('buy', marketPrice - 0.10, savedOpenSwaps[2] || 0)
  ];

  function order(side, openPrice, swap = 0){
    return {
      ticket: ticket++,
      side,
      lot: 0.01,
      openPrice,
      currentPrice: marketPrice,
      priceProfit: 0,
      swap,
      openedAt: new Date()
    };
  }

  function closed(side, openPrice, closePrice, profit, swap = 0){
    return {
      ticket: ticket++,
      side,
      lot: 0.01,
      openPrice,
      closePrice,
      profit,
      swap,
      closedAt: new Date(Date.now() - Math.random() * 3600000)
    };
  }

  function setStatus(text,type){
    /* ซ่อนข้อความสถานะจากหน้าจอ */
  }

  function priceProfit(order){
    const movement = order.side === 'buy'
      ? order.currentPrice - order.openPrice
      : order.openPrice - order.currentPrice;

    return movement * 10;
  }

  function netProfit(order){
    return order.priceProfit + order.swap;
  }

  function closedSwapTotal(){
    return closedOrders.reduce((sum, item) => sum + (item.swap || 0), 0);
  }

  function accountBalance(){
    return deposit + closedProfit + closedSwapTotal();
  }

  function thaiDateKey(date = new Date()){
    return new Intl.DateTimeFormat('en-CA',{
      timeZone:'Asia/Bangkok',
      year:'numeric',
      month:'2-digit',
      day:'2-digit'
    }).format(date);
  }

  function parseDateKey(key){
    const [year, month, day] = key.split('-').map(Number);
    return new Date(Date.UTC(year, month - 1, day));
  }

  function dateKeyFromUtc(date){
    return [
      date.getUTCFullYear(),
      String(date.getUTCMonth() + 1).padStart(2,'0'),
      String(date.getUTCDate()).padStart(2,'0')
    ].join('-');
  }

  function applyOneRollover(rolloverDate){
    const multiplier = rolloverDate.getUTCDay() === TRIPLE_SWAP_DAY ? 3 : 1;

    orders.forEach(item => {
      const rate = item.side === 'buy'
        ? SWAP_BUY_PER_NIGHT
        : SWAP_SELL_PER_NIGHT;

      item.swap += rate * multiplier;
    });

    saveOpenSwaps();
  }

  function applyMissedRollovers(){
    const todayKey = thaiDateKey();
    let lastKey = localStorage.getItem('gold_ui_last_swap_date');

    if(!lastKey){
      localStorage.setItem('gold_ui_last_swap_date', todayKey);
      return;
    }

    let cursor = parseDateKey(lastKey);
    const today = parseDateKey(todayKey);
    let applied = 0;

    while(cursor < today && applied < 14){
      cursor.setUTCDate(cursor.getUTCDate() + 1);
      applyOneRollover(cursor);
      applied++;
    }

    localStorage.setItem('gold_ui_last_swap_date', todayKey);
  }

  function saveOpenSwaps(){
    localStorage.setItem(
      'gold_ui_open_swaps',
      JSON.stringify(orders.map(item => item.swap))
    );
  }

  function render(){
    const balance = accountBalance();
    const floating = orders.reduce((sum,item) => sum + netProfit(item), 0);
    const equity = balance + floating;
    const margin = orders.length * marginPerOrder;
    const free = equity - margin;
    const level = margin ? equity / margin * 100 : 0;
    const todayProfit = Math.max(0, closedProfit - todayStartProfit);
    const progress = Math.min(100, todayProfit / dailyTarget * 100);
    const historySwap = closedSwapTotal();

    const fp = document.getElementById('floatingProfit');
    fp.textContent = `${floating >= 0 ? '+' : ''}${fmt.format(floating)} USD`;
    fp.className = `floating ${floating >= 0 ? 'blue' : 'red'}`;

    document.getElementById('progressText').textContent = `${progress.toFixed(0)}%`;
    document.getElementById('progressBar').style.width = `${progress}%`;
    document.getElementById('balance').textContent = fmt.format(balance);
    document.getElementById('equity').textContent = fmt.format(equity);
    document.getElementById('margin').textContent = fmt.format(margin);
    document.getElementById('freeMargin').textContent = fmt.format(free);
    document.getElementById('marginLevel').textContent = `${fmt.format(level)}%`;
    document.getElementById('goldPrice').textContent = marketPrice.toFixed(3);
    document.getElementById('closedProfit').textContent = fmt.format(closedProfit);
    document.getElementById('totalSwap').textContent =
      `${historySwap >= 0 ? '+' : ''}${fmt.format(historySwap)}`;
    document.getElementById('historyBalance').textContent = fmt.format(balance);

    document.getElementById('orders').innerHTML = orders.map(item => {
      const net = netProfit(item);

      return `
        <article class="order">
          <div class="order-top">
            <div>
              <span class="symbol">XAUUSDm</span>
              <span class="side ${item.side === 'buy' ? 'blue' : 'red'}">
                ${item.side} 0.01
              </span>
            </div>
            <div class="profit ${net >= 0 ? 'blue' : 'red'}">
              ${net >= 0 ? '+' : ''}${fmt.format(net)}
            </div>
          </div>
          <div class="meta">
            <span>
              #${item.ticket} &nbsp;
              ${item.openPrice.toFixed(3)} → ${item.currentPrice.toFixed(3)}
            </span>
            <span>Swap ${item.swap >= 0 ? '+' : ''}${fmt.format(item.swap)}</span>
          </div>
        </article>
      `;
    }).join('');

    document.getElementById('historyOrders').innerHTML =
      closedOrders.slice().reverse().map(item => {
        const net = item.profit + item.swap;

        return `
          <article class="history-order">
            <div class="order-top">
              <div>
                <span class="symbol">XAUUSDm</span>
                <span class="side ${item.side === 'buy' ? 'blue' : 'red'}">
                  ${item.side} 0.01
                </span>
              </div>
              <div class="profit ${net >= 0 ? 'blue' : 'red'}">
                ${net >= 0 ? '+' : ''}${fmt.format(net)}
              </div>
            </div>
            <div class="meta">
              <span>
                ${item.openPrice.toFixed(3)} → ${item.closePrice.toFixed(3)}
              </span>
              <span>Swap ${item.swap >= 0 ? '+' : ''}${fmt.format(item.swap)}</span>
            </div>
          </article>
        `;
      }).join('');
  }

  function applyPrice(price){
    marketPrice = price;

    orders.forEach(item => {
      item.currentPrice = price;
      item.priceProfit = priceProfit(item);
    });

    render();
  }

  async function fetchRealPrice(){
    const key = localStorage.getItem('td_api_key') || '';

    if(!key){
      setStatus('ใช้ราคาสำรอง — กดรูปเฟืองเพื่อใส่ API Key','');
      return;
    }

    try{
      const url =
        `https://api.twelvedata.com/price?symbol=${encodeURIComponent('XAU/USD')}` +
        `&apikey=${encodeURIComponent(key)}`;

      const response = await fetch(url,{cache:'no-store'});
      const data = await response.json();

      if(!response.ok || !data.price){
        throw new Error(data.message || 'โหลดราคาไม่ได้');
      }

      const price = Number(data.price);

      if(!Number.isFinite(price)){
        throw new Error('ราคาไม่ถูกต้อง');
      }

      applyPrice(price);
      setStatus(
        `XAU/USD อัปเดต ${new Date().toLocaleTimeString('th-TH')}`,
        'ok'
      );
    }catch(error){
      console.error(error);
      setStatus('เชื่อมต่อราคาจริงไม่สำเร็จ ตรวจ API Key','err');
    }
  }

  function animateBetweenFetches(){
    marketPrice += localStorage.getItem('td_api_key')
      ? (Math.random() - 0.5) * 0.025
      : (Math.random() - 0.49) * 0.12;

    orders.forEach(item => {
      item.currentPrice = marketPrice;
      item.priceProfit = priceProfit(item);
    });

    render();
  }

  function showView(view){
    document.querySelectorAll('.view').forEach(item => item.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(item => item.classList.remove('active'));

    document.getElementById(view).classList.add('active');
    document.querySelector(`[data-view="${view}"]`).classList.add('active');

    const historyMode = view === 'historyView';

    document.getElementById('tradeHeader').style.display =
      historyMode ? 'none' : 'block';
    document.getElementById('pageTitle').textContent =
      historyMode ? 'History' : 'Trade';

    document.querySelectorAll('.nav').forEach(item => item.classList.remove('active'));
    document.getElementById(
      historyMode ? 'historyNav' : 'tradeNav'
    ).classList.add('active');
  }

  document.querySelectorAll('.tab').forEach(button => {
    button.addEventListener('click', () => showView(button.dataset.view));
  });

  document.getElementById('tradeNav').addEventListener(
    'click',
    () => showView('tradeView')
  );

  document.getElementById('historyNav').addEventListener(
    'click',
    () => showView('historyView')
  );

  applyMissedRollovers();

  orders.forEach(item => {
    item.priceProfit = priceProfit(item);
  });

  render();
  fetchRealPrice();

  setInterval(fetchRealPrice,15000);
  setInterval(animateBetweenFetches,700);
  setInterval(applyMissedRollovers,60000);
})();
</script>
</body>
</html>
