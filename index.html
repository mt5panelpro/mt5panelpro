<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>MT5 Trading</title>
<style>
:root{--bg:#000;--text:#f2f2f4;--muted:#a9a9ae;--blue:#168cf4;--red:#ff5147;--line:#161616;--nav:#1b1b1b;--active:#484848}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#000;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,Tahoma,sans-serif}
body{min-height:100vh}
.screen{width:min(100%,520px);margin:0 auto;min-height:100vh;padding:32px 12px 112px}
.page{display:none}.page.active{display:block}
.top{display:none}
.float{font-size:20px;font-weight:600;color:var(--blue);text-align:center;margin:72px 0 44px;letter-spacing:.1px}
.summary{display:grid;grid-template-columns:1fr auto;gap:7px 14px;font-size:16px;line-height:1.2;font-weight:400}
.summary .v{text-align:right;font-weight:500;font-variant-numeric:tabular-nums}
.section{margin:14px -12px 0;padding:7px 12px;background:#080808;border-top:1px solid #101010;border-bottom:1px solid #101010;font-size:16px;font-weight:500;display:flex;align-items:center;justify-content:space-between}.section .more{color:#777;font-size:9px;font-weight:700;line-height:1;letter-spacing:2px;transform:translateY(-1px)}
.order{padding:13px 0 12px;border-bottom:1px solid #0d0d0d}
.row{display:grid;grid-template-columns:minmax(0,1fr) 92px;align-items:flex-start;column-gap:12px}
 .symbol{font-size:16px;font-weight:500;letter-spacing:0}
 .buy{color:var(--blue);font-size:16px;font-weight:500;letter-spacing:0} .sell{color:var(--red);font-size:16px;font-weight:500;letter-spacing:0}
 .profit{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.05;width:92px;justify-self:end;text-align:right;white-space:nowrap}
.profit.pos{color:var(--blue)}.profit.neg{color:var(--red)}
#history .profit{font-size:16px;font-weight:600}
.sub{display:grid;grid-template-columns:minmax(0,1fr) 170px;column-gap:12px;margin-top:5px;color:var(--muted);font-size:16px;font-weight:400;line-height:1.15;font-variant-numeric:tabular-nums;letter-spacing:0}.sub span:last-child{text-align:right;white-space:nowrap}
.empty{text-align:center;color:#686868;padding:52px 0;font-size:12px}
.tabs{display:flex;background:#1a1a1a;border:1px solid #303030;border-radius:28px;padding:4px;position:sticky;top:10px;z-index:4;margin:82px 22px 0}
.tabs button{flex:1;border:0;background:transparent;color:#f4f4f5;border-radius:23px;padding:10px 5px;font-size:16px;font-weight:500;font-family:inherit}
.tabs button.active{background:#494949}
#historyList{margin-top:4px}
.totals{padding:12px 0 8px;border-top:1px solid #202020}
.totals .r{display:flex;justify-content:space-between;margin:6px 0;font-size:16px;font-weight:400}
.totals b{font-size:16px;font-weight:500;font-variant-numeric:tabular-nums}
.nav{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:min(390px,calc(100% - 92px));display:grid;grid-template-columns:repeat(2,1fr);gap:0;padding:3px;background:#181818;border:1px solid #343434;border-radius:28px;z-index:20;overflow:hidden}
.nav button{border:0;background:transparent;color:#f4f4f4;border-radius:25px;padding:3px 4px 2px;font-size:9px;font-weight:500;font-family:inherit;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.02}
.nav button .navicon{display:block;width:26px;height:26px;margin:0 auto 2px}
.nav button .navicon svg{display:block;width:100%;height:100%}
.nav button.active{background:#454545;color:#2f9dff}
.nav button.active .stroke{stroke:#2f9dff}
.nav button.active .fill{fill:#2f9dff}
.nav button:not(.active) .stroke{stroke:#f1f1f1}
.nav button:not(.active) .fill{fill:#f1f1f1}

body.history-mode .screen{min-height:100vh;padding-bottom:72px}
body.history-mode .totals{padding-bottom:0;margin-top:18px;margin-bottom:18px;transform:none}
@media(min-width:700px){.screen{padding-top:24px}.float{margin-top:50px}.tabs{margin-top:50px}}
</style>
</head>
<body>
<div class="screen">
  <section id="trade" class="page active">
    <div id="floating" class="float">0.00 USD</div>
    <div class="summary">
      <div>Balance:</div><div id="balance" class="v">0.00</div>
      <div>Equity:</div><div id="equity" class="v">0.00</div>
      <div>หลักประกัน:</div><div id="margin" class="v">0.00</div>
      <div>หลักประกันที่เหลือ:</div><div id="free" class="v">0.00</div>
      <div>ระดับหลักประกัน (%):</div><div id="level" class="v">0.00</div>
    </div>
    <div class="section"><span>สถานะ</span><span class="more" aria-hidden="true">•••</span></div>
    <div id="openOrders"></div>
  </section>

  <section id="history" class="page">
    <div class="tabs">
      <button class="active" data-filter="all">ทั้งหมด</button>
      <button data-filter="trade">การซื้อขาย</button>
      <button data-filter="deposit">ฝากเงิน</button>
    </div>
    <div id="historyList"></div>
    <div class="totals">
      <div class="r"><span>เงินฝาก</span><b id="depositTotal">0.00</b></div>
      <div class="r"><span>การถอน</span><b id="withdrawalTotal">0.00</b></div>
      <div class="r"><span>กำไร</span><b id="profitTotal">0.00</b></div>
      <div class="r"><span>Swap</span><b id="swapTotal">0.00</b></div>
      <div class="r"><span>ค่าธรรมเนียม</span><b id="commissionTotal">0.00</b></div>
      <div class="r"><span>Balance</span><b id="balanceTotal">0.00</b></div>
    </div>
  </section>


</div>

<nav class="nav">
  <button class="active" data-page="trade">
    <span class="navicon" aria-hidden="true">
      <svg viewBox="0 0 64 64" fill="none">
        <rect x="8" y="5" width="48" height="54" rx="3" class="stroke" stroke-width="6"/>
        <path d="M16 43L27 31L36 38L49 19" class="stroke" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>
    การซื้อขาย
  </button>
  <button data-page="history">
    <span class="navicon" aria-hidden="true">
      <svg viewBox="0 0 64 64" fill="none">
        <path d="M15 20H5L10 11" class="stroke" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M10 20C15 10 25 6 35 8C48 10 57 21 56 34C55 47 44 57 31 57C21 57 13 52 8 44" class="stroke" stroke-width="5" stroke-linecap="round"/>
        <path d="M32 17V33L22 40" class="stroke" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>
    ประวัติ
  </button>
</nav>

<script>
const KEY='mt5_trade_single_live_v11';
const PRICE_URL='https://diff-enjoying-recommends-component.trycloudflare.com/price';
let latestQuote=null;
let quoteError='';
let fetchingQuote=false;
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
function money(n){return Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function seededTrades(){
  const baselineKey='2026-07-28';
  const baselineTarget=25489.00;
  let seed=918273,out=[],days=[],id=1;
  const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280};
  const nowThai=bangkokParts(new Date());
  const todayKey=`${nowThai.year}-${String(nowThai.month).padStart(2,'0')}-${String(nowThai.day).padStart(2,'0')}`;
  const endKey=todayKey>baselineKey?todayKey:baselineKey;
  const d=new Date(Date.UTC(2026,2,2));
  while(true){
    const key=`${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`;
    if(key>endKey)break;
    const wd=d.getUTCDay();
    if(wd!==0&&wd!==6)days.push(key);
    d.setUTCDate(d.getUTCDate()+1);
  }

  const baselineDays=days.filter(key=>key<=baselineKey);
  const targets=new Map(baselineDays.map(key=>[key,200]));
  let remaining=Math.round(baselineTarget)-baselineDays.length*200;
  let cursor=0;
  while(remaining>0){
    const key=baselineDays[cursor%baselineDays.length];
    if(targets.get(key)<300){targets.set(key,targets.get(key)+1);remaining--}
    cursor+=1+Math.floor(rnd()*7);
  }
  for(const key of days)if(!targets.has(key))targets.set(key,200+Math.floor(rnd()*101));

  function splitWins(total,count){
    const vals=Array(count).fill(50);
    let left=total-count*50;
    while(left>0){
      const i=Math.floor(rnd()*count);
      if(vals[i]<100){vals[i]++;left--}
    }
    return vals;
  }

  for(const key of days){
    const dayTarget=targets.get(key);
    const loss=20+Math.floor(rnd()*11);
    const winCount=dayTarget<=270?3:4;
    const vals=[...splitWins(dayTarget+loss,winCount),-loss];
    for(let i=vals.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[vals[i],vals[j]]=[vals[j],vals[i]]}
    let hour=6+Math.floor(rnd()*15),minute=Math.floor(rnd()*60);
    for(const profit of vals){
      const side=rnd()>.49?'buy':'sell';
      const open=4250+(rnd()-.5)*420;
      const dist=Math.abs(profit)/10;
      const win=profit>=0;
      const close=side==='buy'?open+(win?dist:-dist):open-(win?dist:-dist);
      minute+=8+Math.floor(rnd()*24);hour+=Math.floor(minute/60);minute%=60;
      if(hour>22){hour=22;minute=Math.min(minute,58)}
      const second=Math.floor(rnd()*60);
      const time=new Date(`${key}T${String(hour).padStart(2,'0')}:${String(minute).padStart(2,'0')}:${String(second).padStart(2,'0')}+07:00`).toISOString();
      const tradeId=id++;
      // บางออเดอร์ถือข้ามคืน จึงมีค่า Swap ในประวัติ (วันพุธคิดมากขึ้น)
      const heldOvernight=(tradeId%17===0)||(tradeId%29===0);
      const weekday=new Date(`${key}T12:00:00+07:00`).getDay();
      let swap=0;
      if(heldOvernight){
        const base=side==='buy'?(0.07+rnd()*0.07):(0.04+rnd()*0.06);
        swap=-(weekday===3?base*3:base);
        swap=+swap.toFixed(2);
      }
      out.push({id:`seed-${key}-${tradeId}`,symbol:'XAUUSDm',side,lot:'0.01',open:open.toFixed(3),close:close.toFixed(3),profit,swap,commission:0,time});
    }
  }
  return out.sort((a,b)=>new Date(b.time)-new Date(a.time));
}
function seededWithdrawals(){
  let seed=445566;
  const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280};
  const out=[];
  for(const [year,month] of [[2026,4],[2026,5],[2026,6],[2026,7]]){
    const amount=2000+Math.floor(rnd()*1001);
    const day=2+Math.floor(rnd()*23);
    const hour=8+Math.floor(rnd()*13);
    const minute=Math.floor(rnd()*60);
    const second=Math.floor(rnd()*60);
    const mm=String(month).padStart(2,'0'),dd=String(day).padStart(2,'0');
    out.push({id:`withdraw-${year}-${mm}`,amount,time:`${year}-${mm}-${dd}T${String(hour).padStart(2,'0')}:${String(minute).padStart(2,'0')}:${String(second).padStart(2,'0')}+07:00`,monthKey:`${year}-${mm}`});
  }
  return out;
}
function defaults(){return{deposit:100,depositTime:'2026-03-02T08:00:00+07:00',withdrawals:seededWithdrawals(),closed:seededTrades(),open:null,auto:true,swapTotal:0,commissionTotal:0,lastSwapKey:''}}
function normalize(s){
  const d=defaults();
  s=s&&typeof s==='object'?s:d;
  for(const k of Object.keys(d))if(s[k]===undefined)s[k]=d[k];
  if(!Array.isArray(s.closed))s.closed=[];
  const generated=seededTrades();
  const existingIds=new Set(s.closed.map(x=>String(x.id)));
  for(const x of generated)if(!existingIds.has(String(x.id)))s.closed.push(x);
  s.closed=s.closed.map(x=>({...x,swap:Number(x.swap||0),commission:Number(x.commission||0)}));
  if(!Array.isArray(s.withdrawals))s.withdrawals=[];
  s.withdrawals=s.withdrawals.map(x=>({id:x.id||Date.now(),amount:Math.abs(Number(x.amount||2000)),time:x.time||new Date().toISOString(),monthKey:x.monthKey||''}));
  return s;
}
function load(){try{return normalize(JSON.parse(localStorage.getItem(KEY))||defaults())}catch(e){return defaults()}}
function save(s){localStorage.setItem(KEY,JSON.stringify(s))}
function closedProfit(s){return s.closed.reduce((a,x)=>a+Number(x.profit||0),0)}
function totalSwap(s){return Number(s.swapTotal||0)+s.closed.reduce((a,x)=>a+Number(x.swap||0),0)}
function totalCommission(s){return Number(s.commissionTotal||0)+s.closed.reduce((a,x)=>a+Number(x.commission||0),0)}
function totalWithdrawals(s){return (s.withdrawals||[]).reduce((a,x)=>a+Math.abs(Number(x.amount||0)),0)}
function bal(s){return Number(s.deposit||0)-totalWithdrawals(s)+closedProfit(s)+totalSwap(s)+totalCommission(s)}

function bangkokParts(date=new Date()){
  const parts=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Bangkok',weekday:'short',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(date);
  const o={};for(const p of parts)if(p.type!=='literal')o[p.type]=p.value;
  return{weekday:o.weekday,year:+o.year,month:+o.month,day:+o.day,hour:+o.hour,minute:+o.minute,second:+o.second};
}
function marketStatus(date=new Date()){
  const t=bangkokParts(date),mins=t.hour*60+t.minute;
  const wd={Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6,Sun:0}[t.weekday];
  let open=false;
  if(wd>=1&&wd<=4)open=mins>=300||mins<240;
  else if(wd===5)open=mins>=300||mins<240;
  else if(wd===6)open=mins<240;
  else if(wd===0)open=false;
  return{...t,open,mins,dayIndex:wd};
}
function swapKeyAtClose(t){return `${t.year}-${String(t.month).padStart(2,'0')}-${String(t.day).padStart(2,'0')}`}

function withdrawalDueDate(year,month){
  let seed=year*100+month;
  const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280};
  const day=2+Math.floor(rnd()*23);
  const hour=8+Math.floor(rnd()*13);
  const minute=Math.floor(rnd()*60);
  return new Date(`${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}T${String(hour).padStart(2,'0')}:${String(minute).padStart(2,'0')}:00+07:00`);
}
function maybeApplyMonthlyWithdrawals(s,date=new Date()){
  const start=new Date(s.depositTime||'2026-03-02T08:00:00+07:00');
  const startThai=bangkokParts(start),nowThai=bangkokParts(date);
  let y=startThai.year,m=startThai.month+1;
  if(m===13){m=1;y++}
  while(y<nowThai.year||(y===nowThai.year&&m<=nowThai.month)){
    const key=`${y}-${String(m).padStart(2,'0')}`;
    const due=withdrawalDueDate(y,m);
    const exists=(s.withdrawals||[]).some(x=>x.monthKey===key);
    if(!exists&&date.getTime()>=due.getTime()&&bal(s)>=600){
      const amount=2000+((year*37+month*83)%1001);
      s.withdrawals.push({id:`withdraw-${key}`,amount,time:due.toISOString(),monthKey:key});
    }
    m++;if(m===13){m=1;y++}
  }
}
function maybeApplySwap(s){
  if(!s.open)return;
  const t=marketStatus();
  const inDailyClose=t.mins>=240&&t.mins<300;
  if(!inDailyClose)return;
  const key=swapKeyAtClose(t);
  if(s.open.lastSwapKey===key)return;
  const base=s.open.side==='buy'?-0.08:-0.05;
  const variation=(Math.random()*0.04)-0.02;
  const charge=+(base+variation).toFixed(2);
  s.open.swap=+(Number(s.open.swap||0)+charge).toFixed(2);
  s.open.lastSwapKey=key;
}
function createOrder(q){
  const side=Math.random()>.5?'buy':'sell';
  const p=side==='buy'?Number(q.ask):Number(q.bid);
  return{symbol:q.symbol||'XAUUSDm',side,lot:'0.01',open:p,price:p,profit:0,swap:0,commission:0,started:Date.now(),lastSwapKey:''}
}

async function fetchQuote(){
  if(fetchingQuote)return latestQuote;
  fetchingQuote=true;
  try{
    const r=await fetch(PRICE_URL,{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const q=await r.json();
    if(!q.ok)throw new Error(q.error||'Price service returned ok=false');
    const bid=Number(q.bid),ask=Number(q.ask);
    if(!Number.isFinite(bid)||!Number.isFinite(ask))throw new Error('Invalid bid/ask');
    latestQuote={...q,bid,ask,receivedAt:Date.now()};
    quoteError='';
  }catch(e){
    quoteError=e&&e.message?e.message:String(e);
  }finally{
    fetchingQuote=false;
  }
  return latestQuote;
}
function closeOrder(s){
  if(!s.open)return;
  s.closed.unshift({id:Date.now(),symbol:s.open.symbol,side:s.open.side,lot:s.open.lot,open:s.open.open.toFixed(3),close:s.open.price.toFixed(3),profit:+s.open.profit.toFixed(2),swap:+Number(s.open.swap||0).toFixed(2),commission:+Number(s.open.commission||0).toFixed(2),time:new Date().toISOString()});
  s.open=null;save(s)
}
async function tick(){
  const q=await fetchQuote();
  let s=load(),m=marketStatus();
  maybeApplyMonthlyWithdrawals(s);
  maybeApplySwap(s);

  const live=!!(q&&q.market_live!==false&&Date.now()-q.receivedAt<10000);
  if(s.auto&&m.open&&live){
    if(!s.open)s.open=createOrder(q);
    else{
      // Buy ปิดด้วย Bid, Sell ปิดด้วย Ask เพื่อคิดสเปรดเหมือนตลาดจริง
      s.open.price=s.open.side==='buy'?q.bid:q.ask;
      s.open.profit=(s.open.side==='buy'?s.open.price-s.open.open:s.open.open-s.open.price)*10;
      // คงออเดอร์ปัจจุบันไว้เพื่อไม่ให้ยอดกำไรรายวันเกินแผน 200–300 USD
    }
  }
  save(s);renderTrade(s,m,q)
}
function renderTrade(s=load(),m=marketStatus(),q=latestQuote){
  const b=bal(s),f=s.open?s.open.profit:0,openSwap=s.open?Number(s.open.swap||0):0;
  $('#floating').textContent=money(f)+' USD';
  $('#floating').style.color=f<0?'var(--red)':'var(--blue)';
  $('#balance').textContent=money(b);
  $('#equity').textContent=money(b+f+openSwap);
  const usedMargin=s.open?180.00:0;
  $('#margin').textContent=money(usedMargin);
  $('#free').textContent=money(b+f+openSwap-usedMargin);
  $('#level').textContent=s.open?money((b+f+openSwap)/usedMargin*100):'0.00';
  if(s.open){
    $('#openOrders').innerHTML=`<div class="order"><div class="row"><div><span class="symbol">${s.open.symbol}</span> <span class="${s.open.side}">${s.open.side} ${s.open.lot}</span></div><div class="profit ${s.open.profit>=0?'pos':'neg'}">${money(s.open.profit)}</div></div><div class="sub"><span>${s.open.open.toFixed(3)} → ${s.open.price.toFixed(3)}</span><span></span></div></div>`;
  }else{
    let msg='ตลาดปิด';
    if(m.open){
      if(quoteError)msg='เชื่อมต่อราคาทองไม่ได้';
      else if(!q)msg='กำลังเชื่อมต่อราคาทองจริง…';
      else if(q.market_live===false)msg='ตลาดปิด';
      else msg='กำลังรอเปิดออเดอร์ใหม่…';
    }
    $('#openOrders').innerHTML=`<div class="empty">${msg}</div>`;
  }
}
function renderHistory(filter='all'){
  const s=load();
  $$('[data-filter]').forEach(x=>x.classList.toggle('active',x.dataset.filter===filter));

  const items=[];
  if(filter!=='trade'){
    items.push({kind:'cash',type:'deposit',amount:Number(s.deposit||0),time:s.depositTime||'2026-03-02T08:00:00+07:00'});
    for(const x of (s.withdrawals||[]))items.push({kind:'cash',type:'withdrawal',amount:-Math.abs(Number(x.amount||0)),time:x.time});
  }
  if(filter!=='deposit'){
    for(const x of s.closed)items.push({kind:'trade',...x});
  }

  // MT5 เรียงจากรายการเก่าไว้ด้านบน และรายการล่าสุดไว้ล่างสุด
  items.sort((a,b)=>new Date(a.time)-new Date(b.time));

  const html=items.map(x=>{
    if(x.kind==='cash'){
      return `<div class="order"><div class="row"><div class="symbol">${x.type==='deposit'?'เงินฝาก':'การถอน'}</div><div class="profit ${x.amount>=0?'pos':'neg'}">${money(x.amount)}</div></div><div class="sub"><span>${x.type==='deposit'?'Deposit':'Withdrawal'}</span><span>${new Date(x.time).toLocaleString('sv-SE',{timeZone:'UTC',hour12:false}).replace('T',' ')}</span></div></div>`;
    }
    const swapText=Number(x.swap||0)!==0?` · Swap ${money(x.swap)}`:'';
    return `<div class="order"><div class="row"><div><span class="symbol">${x.symbol}</span> <span class="${x.side}">${x.side} ${x.lot}</span></div><div class="profit ${x.profit>=0?'pos':'neg'}">${money(x.profit)}</div></div><div class="sub"><span>${x.open} → ${x.close}${swapText}</span><span>${new Date(x.time).toLocaleString('sv-SE',{timeZone:'UTC',hour12:false}).replace('T',' ')}</span></div></div>`;
  }).join('');
  $('#historyList').innerHTML=html;

  const p=closedProfit(s),sw=totalSwap(s),cm=totalCommission(s);
  $('#depositTotal').textContent=money(s.deposit);
  $('#withdrawalTotal').textContent=money(-totalWithdrawals(s));
  $('#profitTotal').textContent=money(p);
  $('#swapTotal').textContent=money(sw);
  $('#commissionTotal').textContent=money(cm);
  $('#balanceTotal').textContent=money(bal(s));
}
function showPage(id){
  document.body.classList.toggle('history-mode',id==='history');
  $$('.page').forEach(x=>x.classList.toggle('active',x.id===id));
  $$('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===id));
  if(id==='history'){
    renderHistory('all');
    requestAnimationFrame(()=>requestAnimationFrame(()=>window.scrollTo({top:document.documentElement.scrollHeight,behavior:'instant'})));
  }
}
$$('.nav button').forEach(b=>b.onclick=()=>showPage(b.dataset.page));
$$('[data-filter]').forEach(b=>b.onclick=()=>renderHistory(b.dataset.filter));
renderTrade();renderHistory();tick();setInterval(tick,1100);
</script>
